plugins { id 'com.android.application' }
android {
    namespace 'com.alftech.asplayer.universal'
    compileSdk 36
    defaultConfig {
        applicationId 'com.alftech.asplayer.universal.vlc.final.v592'
        minSdk 21
        targetSdk 36
        versionCode 6012
        versionName '6.0.10'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    // LibVLC stable line; this library includes native codecs and ABIs.
    implementation 'org.videolan.android:libvlc-all:3.7.7'
    implementation 'com.google.android.play:app-update:2.1.0'
    // Secondary VOD engine; keep the same minSdk as the stable VLC build.
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
}
