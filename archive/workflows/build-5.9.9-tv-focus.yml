name: ASPLAYER 5.9.9 TV focus - experimental build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore source and apply TV focus patch
        run: |
          unzip -qo sources/ASPLAYER-5.8.2-Complete-Project.zip -d .
          sed -i 's/compileSdk 35/compileSdk 36/' app/build.gradle
          sed -i 's/import android.app.ActivityNotFoundException;/import android.content.ActivityNotFoundException;/' app/src/main/java/com/alftech/asplayer/universal/MainActivity.java
          python3 patches/seek-controls-5.9.py
          python3 patches/loading-maintenance-5.9.1.py
          python3 patches/tv-focus-5.9.9.py
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path("app/build.gradle")
          s=p.read_text()
          assert re.search(r"versionCode\s+\d+",s), "versionCode not found"
          s=re.sub(r"versionCode\s+\d+", "versionCode 5999", s, count=1)
          assert re.search(r"versionName\s+'[^']+'",s), "versionName not found"
          s=re.sub(r"versionName\s+'[^']+'", "versionName '5.9.9-TV-focus-test'", s, count=1)
          p.write_text(s)
          print("IMPORTANT: debug signing is NOT Play-compatible; verify applicationId against 5.9.7 separately.")
          PY
      - name: Validate JavaScript
        run: |
          for file in app/src/main/assets/*.js; do node --check "$file"; done
      - name: Build debug APK (not an update to Play install)
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ASPLAYER-5.9.9-TV-focus-EXPERIMENTAL-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
