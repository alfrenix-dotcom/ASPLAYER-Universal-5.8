name: ASPLAYER 5.9.9 Play Store base 5.9.7 - TV focus
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/asplayer-5.9.9-playstore-from-5.9.7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore the actual 5.9.7 Play Store source and apply patches
        run: |
          unzip -qo sources/ASPLAYER-5.8.2-Complete-Project.zip -d .
          sed -i 's/compileSdk 35/compileSdk 36/' app/build.gradle
          sed -i 's/import android.app.ActivityNotFoundException;/import android.content.ActivityNotFoundException;/' app/src/main/java/com/alftech/asplayer/universal/MainActivity.java
          python3 patches/seek-controls-5.9.py
          python3 patches/loading-maintenance-5.9.1.py
          python3 patches/video-recovery-5.9.2.py
          python3 patches/upgrade-5.9.3.py
          python3 patches/playstore-api36.py
          python3 patches/manual-server-5.9.5.py
          python3 patches/persistent-session-5.9.6.py
          python3 patches/privacy-link-5.9.7.py
          python3 patches/tv-focus-5.9.9.py
          python3 patches/tv-adaptive-followup-5.9.9.py
          python3 patches/tv-smarter-layout-5.9.9.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle')
          s=p.read_text()
          app_id='com.alftech.asplayer.universal.vlc.final.v592'
          assert "applicationId '"+app_id+"'" in s, 'Play Store 5.9.7 applicationId changed'
          assert re.search(r'versionCode\s+5907\b',s), 'Expected Play Store 5.9.7 base'
          s=re.sub(r'versionCode\s+5907\b','versionCode 5909',s,count=1)
          assert "versionName '5.9.7-LibVLC'" in s
          s=s.replace("versionName '5.9.7-LibVLC'","versionName '5.9.9-LibVLC'")
          p.write_text(s)
          js=Path('app/src/main/assets/app.js').read_text()
          assert "const SERVERS=[{key:'manual',name:'Server',base:''" in js, 'Manual server-only configuration missing'
          assert "https://castlempire.site" not in js and "http://castlempire.site" not in js, 'Unexpected bundled provider'
          print('Play Store package ID, manual-server mode and versionCode 5909 verified')
          PY
      - name: Validate JavaScript and source
        run: |
          python3 tests/check_project.py
          for file in app/src/main/assets/*.js; do node --check "$file"; done
      - name: Build debug test APK and unsigned release AAB
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:bundleRelease
      - name: Verify build outputs and hashes
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/ASPLAYER-5.9.9-PLAYSTORE-BASE-TEST-DEBUG.apk
          cp app/build/outputs/bundle/release/app-release.aab out/ASPLAYER-5.9.9-PLAYSTORE-BASE-UNSIGNED.aab
          sha256sum out/* > out/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ASPLAYER-5.9.9-PLAYSTORE-BASE-TEST-APK-UNSIGNED-AAB
          path: out/*
          retention-days: 14
          if-no-files-found: error
