name: ASPLAYER TV D-pad and Adaptive validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/asplayer-tv-dpad-adaptive-clean
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore base and apply sequential patches
        run: |
          set -euo pipefail
          unzip -qo sources/ASPLAYER-5.8.2-Complete-Project.zip -d .
          sed -i 's/compileSdk 35/compileSdk 36/' app/build.gradle
          sed -i 's/import android.app.ActivityNotFoundException;/import android.content.ActivityNotFoundException;/' app/src/main/java/com/alftech/asplayer/universal/MainActivity.java
          python3 patches/seek-controls-5.9.py
          python3 patches/loading-maintenance-5.9.1.py
          python3 patches/video-recovery-5.9.2.py
          python3 patches/upgrade-5.9.3.py
          python3 patches/manual-server-5.9.5.py
          python3 patches/persistent-session-5.9.6.py
          python3 patches/privacy-link-5.9.7.py
          python3 patches/adaptive-default-tv.py
          python3 patches/tv-dpad-single-handler.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle')
          s=p.read_text()
          print("Gradle app IDs:", re.findall(r"applicationId[^\\n]*",s))
          assert "com.alftech.asplayer.universal.vlc.final.v592" in s
          assert re.search(r'versionCode\s+5907\b',s)
          s=re.sub(r'versionCode\s+5907\b','versionCode 5910',s,count=1)
          s=re.sub(r"versionName\s+'[^']+'","versionName '5.9.10-TV-navigation-test'",s,count=1)
          p.write_text(s)
          js=Path('app/src/main/assets/features-5.9.3.js').read_text()
          assert js.count("document.addEventListener('keydown'")==1
          assert "stopImmediatePropagation" in js
          print('Navigation handler count and app identity checked; signature NOT verified')
          PY
      - name: Validate JavaScript
        run: |
          for f in app/src/main/assets/*.js; do node --check "$f"; done
      - name: Build debug APK (not Play-install compatible)
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ASPLAYER-5.9.10-TV-DPAD-ADAPTIVE-DEBUG-NOT-PLAY-UPDATE
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
