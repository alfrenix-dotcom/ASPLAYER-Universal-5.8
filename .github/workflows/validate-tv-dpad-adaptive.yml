name: ASPLAYER TV D-pad and Adaptive validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-tv-dpad-adaptive.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ce26ee391fbc50cb2e93f2dd659bc354aa9481e2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore base and apply sequential patches
        run: |
          set -euo pipefail
          # Use the original 5.9.7 reconstruction sequence, not a mixed source tree.
          python3 -c "import shutil; shutil.rmtree('app', ignore_errors=True)"
          unzip -qo sources/ASPLAYER-5.8.2-Complete-Project.zip -d .
          sed -i 's/compileSdk 35/compileSdk 36/' app/build.gradle
          sed -i 's/import android.app.ActivityNotFoundException;/import android.content.ActivityNotFoundException;/' app/src/main/java/com/alftech/asplayer/universal/MainActivity.java
          python3 patches/seek-controls-5.9.py
          python3 patches/loading-maintenance-5.9.1.py
          python3 patches/video-recovery-5.9.2.py
          python3 patches/upgrade-5.9.3.py
          python3 patches/playstore-api36.py
          python3 patches/manual-server-5.9.5.py
          python3 patches/persistent-session-5.9.6.py
          python3 patches/privacy-link-5.9.7.py
          python3 patches/adaptive-default-tv.py
          python3 patches/tv-dpad-modal-focus.py
          python3 patches/tv-catalog-player-5.9.12.py
          python3 patches/mobile-vertical-catalog-5.9.13.py
          python3 patches/watch-history-categories-5.9.14.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle')
          s=p.read_text()
          print("Base Gradle identity:", [line.strip() for line in s.splitlines() if any(k in line for k in ("applicationId", "versionCode", "versionName", "targetSdk", "minSdk"))])
          assert "applicationId 'com.alftech.asplayer.universal.vlc.final.v592'" in s, "Unexpected application ID"
          assert re.search(r'versionCode\s+5907\b',s), "Expected original 5.9.7 versionCode 5907"
          assert re.search(r'targetSdk\s+36\b',s), "Expected API 36"
          assert re.search(r'minSdk\s+21\b',s), "Unexpected minimum SDK"
          s=re.sub(r'versionCode\s+5907\b','versionCode 5914',s,count=1)
          s=re.sub(r"versionName\s+'[^']+'","versionName '5.9.14-TV-accessibility-test'",s,count=1)
          p.write_text(s)
          js=Path('app/src/main/assets/features-5.9.3.js').read_text()
          assert js.count("document.addEventListener('keydown'")==1
          assert "stopImmediatePropagation" in js
          assert "lockBackground" in js and "waitingEpisode" in js
          app=Path('app/src/main/assets/app.js').read_text()
          assert "const focusables=[...document.querySelectorAll" not in app
          java=Path('app/src/main/java/com/alftech/asplayer/universal/MainActivity.java')
          j=java.read_text()
          assert "isAndroidTv()" in j
          assert "movePlayerFocus(key)" in j and "selected==timeline" in j
          assert "profile=\"adaptive\"" in j
          assert "tv-catalog-layout" in js and "catalogDirection(e.key)" in js
          assert "settings.bufferProfile||'adaptive'" in Path('app/src/main/assets/features-5.8.js').read_text()
          j=re.sub(r'(getAppVersion\(\)\s*\{\s*return ")[^"]+(")',r'\g<1>5.9.14\2',j)
          java.write_text(j)
          for asset in Path('app/src/main/assets').glob('*'):
              if asset.suffix in ('.html','.js'):
                  asset.write_text(asset.read_text().replace('ASPLAYER Universal 5.9.7','ASPLAYER Universal 5.9.14'))
          print('Navigation handler count and app identity checked; signature NOT verified')
          PY
      - name: Validate JavaScript
        run: |
          for f in app/src/main/assets/*.js; do node --check "$f"; done
      - name: Test actual WebView UI with keyboard and mocked media
        run: |
          npm install --no-save --no-package-lock playwright@1.51.1
          node tests/test-tv-modal.cjs
      - name: Build debug APK (not Play-install compatible)
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ASPLAYER-5.9.14-UNIVERSAL-HISTORY-LISTS-PLAYER-ADAPTIVE-DEBUG-NOT-PLAY-UPDATE
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
      - name: Build unsigned Android App Bundle for future Play signing
        run: gradle --no-daemon --stacktrace :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ASPLAYER-5.9.14-UNSIGNED-AAB-REQUIRES-UPLOAD-KEY
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 14
          if-no-files-found: error
