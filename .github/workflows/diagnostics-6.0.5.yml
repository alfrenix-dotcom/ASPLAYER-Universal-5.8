name: ASPLAYER 6.0.5 — Read-only Stability Baseline
on:
  push:
    branches:
      - diagnostics/6.0.5-stability-baseline
    paths:
      - 'tests/performance/**'
      - 'docs/ASPLAYER-6.0.5-ESTABILIDAD-BASELINE.md'
      - '.github/workflows/diagnostics-6.0.5.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert production app is byte-for-byte unchanged
        run: |
          set -euo pipefail
          git fetch origin 'refs/heads/feature/6.0.4-back-exit-confirmation:refs/remotes/origin/feature/6.0.4-back-exit-confirmation'
          test "$(git rev-parse 'HEAD:app')" = "$(git rev-parse 'refs/remotes/origin/feature/6.0.4-back-exit-confirmation:app')"
          grep -F "versionCode 6007" app/build.gradle
          grep -F "versionName '6.0.5'" app/build.gradle
          echo 'PASS: production app/ tree is unchanged against 6.0.5'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate diagnostic JavaScript
        run: node --check tests/performance/measure-6.0.5.cjs
      - name: Install isolated test runner
        run: npm install --no-save --no-package-lock playwright@1.51.1
      - name: Run existing TV/mobile functional regression tests
        run: |
          node tests/test-exit-back.cjs
          node tests/test-catalog-pager.cjs
          node tests/test-tv-modal.cjs
          node tests/test-details-recents.cjs
      - name: Measure synthetic TV and mobile UI baseline
        run: node tests/performance/measure-6.0.5.cjs
      - name: Publish measurement report as a CI artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ASPLAYER-6.0.5-STABILITY-DIAGNOSTICS
          path: diagnostics-output/
          retention-days: 30
          if-no-files-found: warn
