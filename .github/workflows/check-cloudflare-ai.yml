name: ASPLAYER Cloudflare AI — Production smoke test
on:
  workflow_dispatch:
  push:
    branches: [development/5.9.21-cloudflare-ai]
    paths: ['cloudflare-ai/**', '.github/workflows/check-cloudflare-ai.yml']
permissions:
  contents: read
jobs:
  verify-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify notices and existing AI contracts
        run: |
          node tests/test-online-ai.mjs
          node tests/test-notices.mjs
      - name: Check public service and synopsis endpoints
        run: |
          set -euo pipefail
          worker=https://asplayer-ai.alfrenix.workers.dev
          # Cloudflare builds independently of GitHub Actions; allow time to publish this revision.
          for attempt in $(seq 1 18); do
            if curl -fsS --max-time 10 "$worker/" | jq -e '.version >= 4 and .appVersion == "5.9.25" and (.features | index("announcements-admin") != null)'; then break; fi
            if [ "$attempt" = 18 ]; then echo 'Worker v4 not yet deployed'; exit 1; fi
            sleep 8
          done
          curl -fsS --max-time 15 "$worker/admin" | grep -F 'Centro de avisos'
          curl -fsS --max-time 15 "$worker/api/announcements?lang=es" | jq -e 'has("announcement") and (.announcements | type == "array") and .storageReady == true'
          curl -sS --max-time 15 "$worker/api/admin/notices" | jq -e '.error == "Administration not configured" or .error == "Unauthorized"'
          curl -fsS --max-time 90 "$worker/api/synopsis" -H 'Content-Type: application/json' --data '{"title":"Breaking Bad","category":"series","lang":"es","original":"A chemistry teacher becomes involved in the drug trade after a cancer diagnosis."}' | jq -e '.grounded == true and (.synopsis | type == "string" and length > 15)'
          curl -fsS --max-time 90 "$worker/api/synopsis" -H 'Content-Type: application/json' --data '{"title":"Breaking Bad","category":"series","year":"2008","lang":"es","generate":true}' | jq -e '.generated == true and .grounded == false and (.synopsis | type == "string" and length > 15)'
