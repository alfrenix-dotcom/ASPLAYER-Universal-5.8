name: ASPLAYER Universal — Build and Validate
on:
  workflow_dispatch:
  push:
    branches: [main, development/5.9.18-adaptive-pagination, development/5.9.19-liquid-glass, development/5.9.20-details-recents, development/5.9.21-cloudflare-ai, development/5.9.26-cold-start-notices, development/5.9.27-layout-glass, development/5.9.28-glass-depth, development/6.0-smart, development/6.0.4-settings-dpad, feature/6.0.4-back-exit-confirmation, feature/6.0.6-adaptive-performance, feature/6.0.7-series-continuity, feature/6.0.8-ui-speed, feature/6.0.9-series-player-navigation, feature/6.0.10-hide-server-in-catalog]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'gradle/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify project identity and version
        id: version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, os
          s=Path('app/build.gradle').read_text()
          assert "applicationId 'com.alftech.asplayer.universal.vlc.final.v592'" in s
          assert int(re.search(r'versionCode\s+(\d+)',s)[1]) >= 5917
          assert int(re.search(r'targetSdk\s+(\d+)',s)[1]) >= 36
          assert re.search(r'minSdk\s+21\b',s)
          name=re.search(r"versionName\s+'([^']+)'",s)[1].split('-')[0]
          assert re.fullmatch(r'\d+\.\d+\.\d+',name)
          java=Path('app/src/main/java/com/alftech/asplayer/universal/MainActivity.java').read_text()
          assert re.search(r'getAppVersion\(\)\s*\{\s*return "'+re.escape(name)+r'"',java)
          js=Path('app/src/main/assets/features-5.9.3.js').read_text()
          assert js.count("document.addEventListener('keydown'")==1
          assert "stopImmediatePropagation" in js
          assert "lockBackground" in js and "waitingEpisode" in js
          assert "tv-catalog-layout" in js and "catalogDirection(e.key)" in js
          assert "isAndroidTv()" in java and "movePlayerFocus(key)" in java and "selected==timeline" in java
          assert 'ViewGroup.FOCUS_BLOCK_DESCENDANTS' in java and 'video.setFocusable(enabled)' in java
          assert 'setVideoNavigationEnabled(false);' in java.split('setContentView(root);')[0]
          assert 'setVideoNavigationEnabled(true);video.bringToFront()' in java
          assert 'if(!web.hasFocus()&&!web.requestFocus())web.requestFocusFromTouch();' in java
          assert 'restoreBrowsingFocus(false);' in java.split('int key=event.getKeyCode();',1)[1].split('boolean transport',1)[0]
          assert 'ASPLAYER_REMOTE_FOCUS' in java and 'restoreScreenFocus' in js
          assert 'transportRow.setVisibility(isLive?View.GONE:View.VISIBLE)' in java
          assert 'extrasRow.setVisibility(isLive?View.GONE:View.VISIBLE)' in java
          assert 'liveCloseButton.setVisibility(isLive?View.VISIBLE:View.GONE)' in java
          assert 'liveAspectButton.setVisibility(isLive?View.VISIBLE:View.GONE)' in java
          assert 'liveAspectButton=button("Fill screen",this::toggleAspect)' in java
          assert 'pictureMode="contain"' in java and 'pictureMode="contain".equals(pictureMode)?"cover":"contain"' in java
          assert 'return isLive?repairVideoButton:playPause' in java
          assert 'isLive=url.contains("/live/");\n        configurePlaybackControls();' in java
          assert 'profile="adaptive"' in java
          assert "settings.bufferProfile||'adaptive'" in Path('app/src/main/assets/features-5.8.js').read_text()
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('name='+name+'\n')
          print('Source identity, version and navigation checks passed; signing not verified.')
          PY
      - name: Test Back-to-exit routing on Android and Android TV
        run: node tests/test-exit-back.cjs
      - name: Test native live startup policy
        run: |
          mkdir -p "$RUNNER_TEMP/live-policy-tests"
          javac -d "$RUNNER_TEMP/live-policy-tests" app/src/main/java/com/alftech/asplayer/universal/LivePlaybackPolicy.java tests/LivePlaybackPolicyTest.java
          java -cp "$RUNNER_TEMP/live-policy-tests" com.alftech.asplayer.universal.LivePlaybackPolicyTest
      - name: Verify adaptive UI policy without Android hardware
        run: |
          mkdir -p "$RUNNER_TEMP/performance-policy"
          javac -d "$RUNNER_TEMP/performance-policy" app/src/main/java/com/alftech/asplayer/universal/AdaptivePerformancePolicy.java tests/AdaptivePerformancePolicyTest.java
          java -cp "$RUNNER_TEMP/performance-policy" com.alftech.asplayer.universal.AdaptivePerformancePolicyTest
      - name: Validate JavaScript
        run: |
          for f in app/src/main/assets/*.js; do node --check "$f"; done
      - name: Test actual WebView UI with keyboard and mocked media
        run: |
          npm install --no-save --no-package-lock playwright@1.51.1
          node tests/test-tv-modal.cjs
          node tests/test-catalog-pager.cjs
          node tests/test-liquid-glass.cjs
          node tests/test-catalog-layout.cjs
          node tests/test-details-recents.cjs
          node tests/test-online-ai.mjs
          node tests/test-notices.mjs
          node tests/test-ai-ui.cjs
          node tests/test-picture-mode.cjs
          node tests/test-adaptive-performance.cjs
          node tests/test-series-continuity.cjs
          node tests/test-ui-speed.cjs
          node tests/test-hide-server-label.cjs
      - name: Build debug APK (not Play-install compatible)
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify packaged adaptive launcher resources
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump resources "$apk" > /tmp/asplayer-resources.txt
          grep -F 'mipmap/ic_launcher' /tmp/asplayer-resources.txt
          grep -F 'drawable/asplayer_icon_art' /tmp/asplayer-resources.txt
          python3 - "$apk" <<'PY'
          import sys, zipfile
          names=zipfile.ZipFile(sys.argv[1]).namelist()
          assert any(n.endswith('/ic_launcher.xml') and 'anydpi' in n for n in names), 'Missing adaptive icon XML'
          assert any(n.endswith('/asplayer_icon_art.jpg') for n in names), 'Missing full-bleed artwork'
          print('Packaged native adaptive icon verified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ASPLAYER-${{ steps.version.outputs.name }}-UNIVERSAL-DEBUG-NOT-PLAY-UPDATE
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
      - name: Build unsigned Android App Bundle for future Play signing
        run: gradle --no-daemon --stacktrace :app:bundleRelease
      - name: Validate production bundle and 16 KiB native libraries
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error 'https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar' -o /tmp/bundletool.jar
          bundle="$(find app/build/outputs/bundle/release -name '*.aab' -print -quit)"
          test -n "$bundle"
          python3 tests/validate-play-bundle.py "$bundle" /tmp/bundletool.jar
      - uses: actions/upload-artifact@v4
        with:
          name: ASPLAYER-${{ steps.version.outputs.name }}-PLAY-RELEASE-UNSIGNED-REQUIRES-UPLOAD-KEY
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: error
