name: Build ASPLAYER 5.8.2 Full UI LibVLC APK
on:
  push:
    branches: [main]
    paths:
      - 'sources/ASPLAYER-5.8.2-Complete-Project.zip'
      - '.github/workflows/build-integrated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore full ASPLAYER UI, assets and LibVLC bridge
        run: |
          unzip -qo sources/ASPLAYER-5.8.2-Complete-Project.zip -d .
          sed -i 's/compileSdk 35/compileSdk 36/' app/build.gradle
          grep -n 'applicationId\|versionName\|compileSdk' app/build.gradle
          test -s app/src/main/assets/features-5.7.1.js
          test -s app/src/main/assets/features-5.8.js
      - name: Validate source
        run: |
          python3 tests/check_project.py
          for file in app/src/main/assets/*.js; do node --check "$file"; done
      - name: Compile and sign debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -n 2
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/SHA256.txt
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASPLAYER-5.8.2-Full-LibVLC-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256.txt
          retention-days: 30
          if-no-files-found: error
