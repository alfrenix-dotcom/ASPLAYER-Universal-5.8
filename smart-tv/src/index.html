<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>ASPLAYER by Alftech Solutions</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070d1d;color:#edf5ff;font:20px Arial,sans-serif}button,input,select{font:inherit;color:inherit;background:#14253d;border:2px solid #35516c;border-radius:9px;padding:12px;margin:5px}button{cursor:pointer}button:focus,input:focus,select:focus{outline:3px solid #58e6e5;outline-offset:2px;background:#22405c}button:disabled{opacity:.5}h1,h2,h3{margin:12px 0}p{line-height:1.4}header{padding:18px 28px;display:flex;align-items:center;border-bottom:1px solid #30425f;background:#101a30}header img{width:84px;height:68px;object-fit:contain;margin-right:16px}header small{display:block;color:#9cd7e7;font-size:14px;letter-spacing:2px}#status{margin-left:auto;color:#a8d9e5;font-size:16px}#login,#gate{max-width:690px;margin:30px auto;padding:24px;border:1px solid #40577b;border-radius:20px;background:#101a30}label{display:block;color:#b8cce1}input{width:95%}#shell{display:flex;height:calc(100vh - 105px)}nav{width:230px;padding:15px;background:#101a30;flex-shrink:0}nav button{display:block;width:95%;text-align:left}main{flex:1;min-width:0;overflow:auto;padding:20px 30px}#browse{display:flex;align-items:flex-start}#cats{width:235px;max-height:65vh;overflow:auto;flex-shrink:0}#cats button{width:95%;text-align:left;font-size:17px;white-space:normal}#items{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-content:flex-start}#items button{width:calc(25% - 10px);min-width:135px;min-height:100px;overflow:hidden;text-align:left}#items img{width:100%;height:120px;object-fit:contain;display:block;margin-bottom:8px}#query{width:55%}#player{position:fixed;top:0;right:0;bottom:0;left:0;background:#000;z-index:5}video,#av{position:absolute;width:100%;height:100%;top:0;left:0;object-fit:contain}#controls{position:absolute;bottom:0;left:0;right:0;background:rgba(8,15,30,.94);padding:18px;z-index:7}#player.avplaying{background:transparent}#player.avplaying #av{background:transparent}#notice{position:fixed;top:18%;left:25%;width:50%;z-index:10;padding:24px;background:#17243e;border:2px solid #58e6e5;border-radius:14px}#details{margin:12px 0;padding:15px;background:#101a30} [hidden]{display:none!important} .hint{color:#a5b7d1;font-size:16px} .selected{border-color:#53dfdc}
</style></head><body>
<header id="header"><img src="brand-logo.jpg" alt="" onerror="this.hidden=true"><div><strong>ASPLAYER</strong><small>BY ALFTECH SOLUTIONS</small></div><span id="status" role="status"></span></header>
<section id="gate"><h2 id="gateTitle">Device PIN</h2><p id="gateHint" class="hint"></p><input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off"><button id="unlock">Continue</button></section>
<section id="login" hidden><h2 data-en="Sign in" data-es="Iniciar sesión"></h2><p class="hint" data-en="Use your own authorized subscription. ASPLAYER supplies no content." data-es="Usa tu suscripción autorizada. ASPLAYER no proporciona contenido."></p><label data-en="Server URL" data-es="URL del servidor"></label><input id="host" placeholder="https://example.com" autocomplete="off"><label data-en="Username" data-es="Usuario"></label><input id="user" autocomplete="off"><label data-en="Password" data-es="Contraseña"></label><input id="pass" type="password" autocomplete="off"><button id="connect" data-en="Connect" data-es="Conectar"></button><button id="languageLogin">ES / EN</button><p id="loginError" role="alert"></p></section>
<div id="shell" hidden><nav id="nav"><button data-tab="home" data-en="Home" data-es="Inicio"></button><button data-tab="live" data-en="Live TV" data-es="TV en vivo"></button><button data-tab="vod" data-en="Movies" data-es="Películas"></button><button data-tab="series" data-en="Series" data-es="Series"></button><button data-tab="settings" data-en="Settings" data-es="Ajustes"></button></nav><main><h2 id="title"></h2><section id="home"><p data-en="Your content. Your universe." data-es="Tu contenido. Tu universo."></p><p>alftechsolutions.com</p><div id="recent"></div></section><section id="catalog" hidden><input id="query" placeholder="Search / Buscar"><button id="refresh" data-en="Refresh" data-es="Actualizar"></button><div id="browse"><aside id="cats"></aside><div id="items"></div></div><button id="more" data-en="Show more" data-es="Mostrar más"></button><section id="details" hidden></section></section><section id="settings" hidden><button id="language">ES / EN</button><label data-en="Sort" data-es="Orden"></label><select id="sort"><option value="new">Newest / Recientes</option><option value="rating">Rating / Valoración</option></select><label data-en="Optional HTTPS enrichment service" data-es="Servicio HTTPS de IA opcional"></label><input id="worker" placeholder="https://…"><button id="saveWorker" data-en="Save" data-es="Guardar"></button><button id="clearHistory" data-en="Clear history" data-es="Borrar historial"></button><button id="logout" data-en="Sign out" data-es="Cerrar sesión"></button><p class="hint">ASPLAYER Smart TV 1.0.0 · alftechsolutions.com</p></section></main></div>
<div id="player" hidden><video id="video" playsinline></video><object id="av" type="application/avplayer" hidden></object><section id="controls"><p id="playing"></p><p id="feedback" role="status"></p><button id="stop">Back / Atrás</button><button id="pause">Play / Pause</button><button id="rewind">−30s</button><button id="forward">+30s</button><button id="aspect">Fit / Fill</button><label for="audio" style="display:inline">Audio</label><select id="audio"></select><label for="subs" style="display:inline">CC</label><select id="subs"></select></section></div><div id="notice" hidden><p id="noticeText"></p><button id="dismiss">OK</button></div>
<script src="platform.js"></script><script src="app.js"></script></body></html>
